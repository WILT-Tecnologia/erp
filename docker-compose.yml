services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost:8989
    command: ["npx", "ng", "serve", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000", "--allowed-hosts"]
    depends_on:
      nginx:
        condition: service_started
    networks:
      - erp

  app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: erp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-holy}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-holy}
      - DB_CACHE_CONNECTION=pgsql
      - DB_QUEUE_CONNECTION=pgsql
      - SESSION_CONNECTION=pgsql
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - erp

  nginx:
    image: nginx:alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "8989:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx/:/etc/nginx/conf.d/
    depends_on:
      app:
        condition: service_healthy
    networks:
      - erp

  db:
    image: postgres:15
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-holy}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-holy}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-holy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp

  pgadmin:
    image: dpage/pgadmin4
    container_name: erp-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@wilt.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-wilt}
      PGADMIN_LISTEN_PORT: 80
    networks:
      - erp

  redis:
    image: redis:latest
    container_name: erp-redis
    networks:
      - erp

volumes:
  postgres_data:

networks:
  erp:
    driver: bridge
