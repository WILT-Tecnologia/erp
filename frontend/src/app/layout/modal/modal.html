<div [class]="fullscreen() ? 'absolute inset-0 flex min-h-0 flex-col' : 'flex h-full min-h-0 flex-col'">
  <div class="flex items-start justify-between gap-4 border-b border-outline-variant bg-surface-variant! px-6 py-4">
    <div class="min-w-0 flex-1">
      <ng-content select="[modal-header]" />
      @if (modalTitle()) {
        <h2 class="m-0 text-xl font-semibold text-on-surface">{{ modalTitle() }}</h2>
      }
    </div>
    <div class="flex shrink-0 gap-1">
      @if (showFullscreenButton()) {
        <button type="button" mat-icon-button aria-label="Tela cheia" (click)="toggleFullscreen()">
          <mat-icon>{{ fullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
      }
      @if (showCloseButton()) {
        <button type="button" mat-icon-button aria-label="Fechar" (click)="closed.emit()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  </div>

  <div
    [class]="
      fullscreen()
        ? 'flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-6 py-4'
        : 'flex max-h-[70vh] flex-col gap-4 overflow-y-auto px-6 py-4'
    "
  >
    <ng-content />
  </div>

  <div class="flex justify-end gap-2 border-t border-outline-variant px-6 py-3 bg-surface-variant!">
    <ng-content select="[modal-footer]" />
  </div>
</div>
