<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal [modalTitle]="isEdit ? 'Editar usuário' : 'Novo usuário'" (closed)="cancel()">
    <app-text-field label="Nome" placeholder="Nome completo" formControlName="name" />
    <app-email-field label="E-mail" placeholder="email@igreja.org" formControlName="email" />
    <app-text-field label="Telefone" placeholder="(00) 00000-0000" formControlName="phone" />

    <div class="flex gap-3">
      <app-select-field class="flex-1" label="Cargo" [options]="roleOptions" formControlName="role" />
      <app-select-field class="flex-1" label="Status" [options]="statusOptions" formControlName="status" />
    </div>

    <app-text-field label="Organização" placeholder="Igreja Central Demo" formControlName="organization" />

    <div modal-footer>
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit">Salvar</button>
    </div>
  </app-modal>
</form>
