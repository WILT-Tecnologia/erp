<button
  type="button"
  (click)="onClick()"
  class="w-full rounded-lg border border-gray-200 bg-white p-3.5 text-left transition-colors hover:border-primary hover:shadow-sm dark:border-gray-700 dark:bg-gray-800"
>
  <div class="mb-2 text-sm font-semibold leading-tight text-gray-900 dark:text-gray-100">
    {{ contact().name }}
  </div>
  <div class="mb-2 text-xs text-gray-500 dark:text-gray-400">
    {{ contact().assignee || '—' }}
  </div>

  @if (contact().tags.length > 0) {
    <div class="mb-2 flex flex-wrap gap-1">
      @for (tag of contact().tags; track tag) {
        <span class="rounded-full bg-gray-100 px-1.5 py-0.5 text-[10px] font-medium text-gray-600 dark:bg-gray-700 dark:text-gray-300">
          {{ tag }}
        </span>
      }
    </div>
  }

  <div class="mt-2 flex items-center justify-between gap-2">
    @if (contact().value > 0) {
      <span class="text-sm font-bold text-emerald-600 dark:text-emerald-400">
        R$ {{ formatCurrency(contact().value) }}
      </span>
    } @else {
      <span class="truncate text-xs text-gray-500 dark:text-gray-400">
        {{ contact().email || '—' }}
      </span>
    }
    <span class="shrink-0 pl-2 text-[11px] text-gray-400 dark:text-gray-500">
      {{ formatDate(contact().updated_at) }}
    </span>
  </div>
</button>
