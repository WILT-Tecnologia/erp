<h2 mat-dialog-title>Novo Lead / Contato</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-4 !pt-2">
    <mat-form-field appearance="outline">
      <mat-label>Nome / Empresa</mat-label>
      <input matInput formControlName="name" placeholder="Ex: Família Silva" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" formControlName="email" placeholder="email@exemplo.com" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefone</mat-label>
      <input matInput formControlName="phone" placeholder="(00) 00000-0000" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estágio inicial</mat-label>
      <mat-select formControlName="status">
        @for (stage of stages; track stage.id) {
          <mat-option [value]="stage.id">{{ stage.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Responsável</mat-label>
      <mat-select formControlName="assignee">
        @for (assignee of assignees; track assignee) {
          <mat-option [value]="assignee">{{ assignee }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor potencial (R$)</mat-label>
      <input matInput type="number" min="0" formControlName="value" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tags (separadas por vírgula)</mat-label>
      <input matInput formControlName="tags" placeholder="Ex: Família, Jovem, Evangelização" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Criar Lead</button>
  </mat-dialog-actions>
</form>
