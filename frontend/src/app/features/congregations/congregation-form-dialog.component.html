<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal [modalTitle]="isEdit ? 'Editar congregação' : 'Nova congregação'" (closed)="cancel()">
    <app-text-field label="Nome da congregação" formControlName="name" />

    <div class="grid grid-cols-2 gap-4">
      <app-text-field label="Código" formControlName="code" />
      <app-select-field label="Status" [options]="statusOptions" formControlName="status" />
    </div>

    <app-text-field label="Igreja vinculada" formControlName="church" />
    <app-text-field label="Líder responsável" formControlName="leader" />

    <div class="grid grid-cols-2 gap-4">
      <app-text-field label="Cidade" formControlName="city" />
      <app-text-field label="UF" [maxLength]="2" formControlName="state" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <app-number-field label="Nº de membros" [min]="0" formControlName="members" />
      <app-text-field label="Telefone" formControlName="phone" />
    </div>

    <div modal-footer>
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit">Salvar</button>
    </div>
  </app-modal>
</form>
