<div class="flex items-center justify-center min-h-screen bg-surface-variant/30 px-4">
  <mat-card class="w-full max-w-md p-8 sm:p-10">
    <div class="flex flex-col items-center text-center gap-3 mb-2">
      <div class="flex items-center justify-center w-14 h-14 rounded-full bg-primary/10 text-primary">
        <mat-icon class="w-7! h-7! text-3xl!">apps</mat-icon>
      </div>
      <div>
        <h1 class="text-2xl font-semibold text-on-surface">ERP Sistema</h1>
        <p class="text-sm text-on-surface/60 mt-1">
          @if (isTenantHost) {
            Acesse sua organização
          } @else {
            Acesse o painel administrativo com sua conta de administrador
          }
        </p>
      </div>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5 mt-6">
        <app-email-field
          label="E-mail"
          placeholder="voce@empresa.com"
          formControlName="email"
          [errorMessages]="{ required: () => 'Informe seu e-mail.' }"
        >
          <mat-icon matPrefix class="text-base! text-on-surface/40 mr-2">mail</mat-icon>
        </app-email-field>

        <app-text-field
          label="Senha"
          [type]="hidePassword() ? 'password' : 'text'"
          placeholder="Sua senha"
          formControlName="password"
          [errorMessages]="{ required: () => 'Informe sua senha.' }"
        >
          <mat-icon matPrefix class="text-base! text-on-surface/40 mr-2">lock</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'"
            (click)="hidePassword.set(!hidePassword())"
          >
            <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </app-text-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="submitting()" class="mt-2! h-11! text-base!">
          @if (submitting()) {
            <mat-spinner diameter="20" class="inline-block mr-2"></mat-spinner>
          }
          Entrar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
