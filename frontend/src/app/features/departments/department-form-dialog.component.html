<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal [modalTitle]="isEdit ? 'Editar departamento' : 'Novo departamento'" (closed)="cancel()">
    <app-text-field label="Nome" placeholder="Louvor e Adoração" formControlName="name" />

    <app-text-field label="Igreja" placeholder="Igreja Central" formControlName="church" />

    <div class="flex gap-3">
      <app-text-field class="flex-1" label="Líder" placeholder="Ana Beatriz" formControlName="leader" />
      <app-number-field class="w-32" label="Membros" [min]="0" formControlName="members" />
    </div>

    <app-description-field
      label="Descrição"
      [rows]="3"
      placeholder="Breve descrição do departamento"
      formControlName="description"
    />

    <app-select-field label="Status" [options]="statusOptions" formControlName="status" />

    <div modal-footer>
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit">Salvar</button>
    </div>
  </app-modal>
</form>
