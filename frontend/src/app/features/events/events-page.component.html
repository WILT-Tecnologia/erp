<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-medium">Eventos</h1>
      <p class="text-sm text-on-surface/60">Gerencie os eventos e atividades das igrejas</p>
    </div>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Novo evento
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <mat-card class="p-4">
      <div class="text-sm text-on-surface/60">Agendados / em andamento</div>
      <div class="text-2xl font-semibold">{{ scheduledCount() }}</div>
    </mat-card>
    <mat-card class="p-4">
      <div class="text-sm text-on-surface/60">Inscritos no total</div>
      <div class="text-2xl font-semibold">{{ totalParticipants() }}</div>
    </mat-card>
    <mat-card class="p-4">
      <div class="text-sm text-on-surface/60">Eventos concluídos</div>
      <div class="text-2xl font-semibold">{{ completedCount() }}</div>
    </mat-card>
  </div>

  <app-data-grid [columns]="columns" [data]="events()" [loading]="loading()" persistKey="events">
    <ng-template #rowActions let-row>
      <button mat-icon-button (click)="openEdit(row)" matTooltip="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="remove(row)" matTooltip="Excluir">
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>
  </app-data-grid>
</div>
