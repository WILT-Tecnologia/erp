<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal [modalTitle]="isEdit ? 'Editar evento' : 'Novo evento'" (closed)="cancel()">
    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title" placeholder="Culto de Celebração" />
    </mat-form-field>

    <div class="flex gap-3">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Igreja</mat-label>
        <input matInput formControlName="church" placeholder="Igreja Central" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          @for (category of categories; track category) {
            <mat-option [value]="category">{{ category }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="flex gap-3">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Local</mat-label>
        <input matInput formControlName="location" placeholder="Templo Central" />
      </mat-form-field>
    </div>

    <div class="flex gap-3">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Inscritos</mat-label>
        <input matInput type="number" min="0" formControlName="participants" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Capacidade</mat-label>
        <input matInput type="number" min="1" formControlName="capacity" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        @for (status of statuses; track status.value) {
          <mat-option [value]="status.value">{{ status.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div modal-footer>
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit">Salvar</button>
    </div>
  </app-modal>
</form>
