<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-medium">Contas a Pagar</h1>
      <p class="text-sm text-on-surface/60">Despesas da organização</p>
    </div>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nova conta a pagar
    </button>
  </div>

  <app-data-grid
    [columns]="columns"
    [data]="transactions()"
    [loading]="loading()"
    persistKey="financial-accounts-payable"
  >
    <ng-template #rowActions let-row>
      <button mat-icon-button (click)="openEdit(row)" matTooltip="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="remove(row)" matTooltip="Excluir">
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>
  </app-data-grid>
</div>
