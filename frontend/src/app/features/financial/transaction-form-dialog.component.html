<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal [modalTitle]="isEdit ? 'Editar transação' : 'Nova transação'" (closed)="cancel()">
    <mat-button-toggle-group formControlName="type" class="w-full">
      <mat-button-toggle value="receita" class="flex-1">Receita</mat-button-toggle>
      <mat-button-toggle value="despesa" class="flex-1">Despesa</mat-button-toggle>
    </mat-button-toggle-group>

    <app-text-field label="Descrição" placeholder="Ex: Dízimo culto domingo" formControlName="description" />

    <div class="flex flex-col gap-3 md:flex-row">
      <app-number-field class="flex-1" label="Valor (R$)" [step]="0.01" formControlName="amount" />
      <app-date-field class="flex-1" label="Data" formControlName="date" />
    </div>

    <div class="flex flex-col gap-3 md:flex-row">
      <app-select-field class="flex-1" label="Categoria" [options]="categoryOptions" formControlName="category" />
      <app-select-field class="flex-1" label="Conta" [options]="accountOptions" formControlName="account" />
    </div>

    <div class="flex flex-col gap-3 md:flex-row">
      <app-select-field class="flex-1" label="Forma de pagamento" [options]="methodOptions" formControlName="method" />
      <app-select-field class="flex-1" label="Status" [options]="statusOptions" formControlName="status" />
    </div>

    <div modal-footer class="flex gap-2">
      <button mat-button color="warn" type="button" (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit">Salvar</button>
    </div>
  </app-modal>
</form>
