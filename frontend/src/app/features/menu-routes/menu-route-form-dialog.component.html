<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal [modalTitle]="isEdit ? 'Editar item de menu' : 'Novo item de menu'" (closed)="cancel()">
    <app-text-field label="Título" formControlName="title" />

    <app-text-field label="Rota (slug)" placeholder="/dashboard/admins" formControlName="slug" />

    <div class="flex items-end gap-3">
      <app-text-field class="flex-1" label="Ícone" placeholder="people" formControlName="icon" />
      <mat-icon class="mb-5 text-3xl">{{ form.value.icon || 'help_outline' }}</mat-icon>
    </div>

    <app-text-field label="Categoria" placeholder="Administração" formControlName="category" />

    <app-select-field label="Item pai" [options]="parentOptions" formControlName="parent_id" />

    <app-number-field label="Ordem" formControlName="sort_order" />

    <app-switch-field label="Ativo" formControlName="is_active" />

    <div modal-footer>
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit">Salvar</button>
    </div>
  </app-modal>
</form>
