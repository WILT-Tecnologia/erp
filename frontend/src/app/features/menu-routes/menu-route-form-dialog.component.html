<h2 mat-dialog-title>{{ isEdit ? 'Editar item de menu' : 'Novo item de menu' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-4 !pt-2">
    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rota (slug)</mat-label>
      <input matInput formControlName="slug" placeholder="/dashboard/admins" />
    </mat-form-field>

    <div class="flex items-end gap-3">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Ícone</mat-label>
        <input matInput formControlName="icon" placeholder="people" />
      </mat-form-field>
      <mat-icon class="mb-5 text-3xl">{{ form.value.icon || 'help_outline' }}</mat-icon>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Categoria</mat-label>
      <input matInput formControlName="category" placeholder="Administração" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Item pai</mat-label>
      <mat-select formControlName="parent_id">
        <mat-option [value]="null">Nenhum (item raiz)</mat-option>
        @for (option of parentOptions; track option.id) {
          <mat-option [value]="option.id">{{ option.title }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ordem</mat-label>
      <input matInput type="number" formControlName="sort_order" />
    </mat-form-field>

    <mat-slide-toggle formControlName="is_active">Ativo</mat-slide-toggle>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Salvar</button>
  </mat-dialog-actions>
</form>
