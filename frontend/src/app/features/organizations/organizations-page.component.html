<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-medium">Organizações</h1>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nova organização
    </button>
  </div>

  <app-data-grid [columns]="columns" [data]="organizations()" [loading]="loading()" persistKey="organizations">
    <ng-template #rowActions let-row>
      <button mat-icon-button (click)="openDashboard(row)" matTooltip="Ver painel da organização">
        <mat-icon>dashboard</mat-icon>
      </button>
      <button mat-icon-button (click)="openEdit(row)" matTooltip="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="toggleStatus(row)" [matTooltip]="row.status === 'suspended' ? 'Reativar' : 'Suspender'">
        <mat-icon>{{ row.status === 'suspended' ? 'play_arrow' : 'pause' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="remove(row)" matTooltip="Excluir">
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>
  </app-data-grid>
</div>
