<mat-form-field
  [appearance]="appearance()"
  [floatLabel]="floatLabel()"
  class="w-full!"
  [class.has-projected-prefix]="hasIconPrefix()"
  [class.has-projected-suffix]="hasIconSuffix()"
>
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }

  <ng-content select="[matPrefix]"></ng-content>

  <input
    matInput
    [type]="type()"
    [formControl]="innerControl"
    [placeholder]="placeholder()"
    [attr.maxlength]="maxLength() ?? null"
    [attr.minlength]="minLength() ?? null"
    [required]="isRequired"
    (blur)="onTouched()"
  />

  @if (suffixIcon(); as icon) {
    <mat-icon matSuffix [class]="suffixClass()" [matTooltip]="suffixTooltip()">
      {{ icon }}
    </mat-icon>
  }

  <ng-content select="[matSuffix]"></ng-content>

  @if (hint() && !shouldShowError) {
    <mat-hint>{{ hint() }}</mat-hint>
  }

  @if (shouldShowError) {
    <mat-error>{{ errorMessage }}</mat-error>
  }
</mat-form-field>
