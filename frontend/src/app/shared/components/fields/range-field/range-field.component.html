<div class="flex flex-col gap-1">
  @if (label()) {
    <span class="text-xs text-on-surface-variant">{{ label() }}</span>
  }
  <mat-slider [min]="min()" [max]="max()" [step]="step()" [discrete]="discrete()" [disabled]="innerControl.disabled" class="w-full">
    <input matSliderStartThumb [value]="startValue()" (valueChange)="handleStartChange($event)" />
    <input matSliderEndThumb [value]="endValue()" (valueChange)="handleEndChange($event)" />
  </mat-slider>
  @if (shouldShowError) {
    <div class="text-xs text-error">{{ errorMessage }}</div>
  }
</div>
